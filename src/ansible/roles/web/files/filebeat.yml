filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
      - /var/log/nginx/error.log
    processors:
      - drop_fields:
          fields:
            [
              "beat",
              "input_type",
              "prospector",
              "input",
              "host",
              "agent",
              "ecs",
            ]
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
