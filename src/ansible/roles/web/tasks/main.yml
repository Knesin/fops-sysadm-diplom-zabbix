---
- name: Deploy index page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
  notify: restart nginx

- name: Copy nginx status config
  copy:
    src: nginx_status.conf
    dest: /etc/nginx/conf.d/status.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart nginx

- name: Copy custom nginx conf for Zabbix agent
  copy:
    src: nginx_custom.conf
    dest: /etc/zabbix/zabbix_agent2.d/nginx_custom.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart zabbix-agent2

# Install filebeat
- name: Remove old conflicting apt sources list if exists
  file:
    path: /etc/apt/sources.list.d/elastic-7.x.list
    state: absent

- name: Add Elastic APT repository (Yandex Mirror)
  apt_repository:
    repo: "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/7/ stable main"
    filename: elastic-7.x
    state: present
    update_cache: yes

- name: Install Filebeat
  apt:
    name: filebeat
    state: present
    update_cache: yes

- name: Copy filebeat config
  copy:
    src: filebeat.yml
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0644"
  notify: restart filebeat