---
- name: Download Zabbix repository release package
  apt:
    deb: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb

- name: Install Zabbix Agent2
  apt:
    name:
      - zabbix-agent2
    state: present
    update_cache: yes

- name: Copy Zabbix Agent2 conf
  copy:
    src: zabbix_agent2.conf
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart zabbix-agent2