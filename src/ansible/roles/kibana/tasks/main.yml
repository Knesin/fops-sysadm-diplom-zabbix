#     mode: '0644'

- name: Remove old conflicting apt sources list if exists
  file:
    path: /etc/apt/sources.list.d/elastic-7.x.list
    state: absent

- name: Add Elastic APT repository (Yandex Mirror)
  apt_repository:
    repo: "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/7/ stable main"
    filename: elastic-7.x
    state: present
    update_cache: yes

- name: Install Kibana
  apt:
    name: kibana
    state: present
    update_cache: yes

- name: Copy kibana service config
  copy:
    src: kibana.yml
    dest: /etc/kibana/kibana.yml
    owner: root
    group: root
    mode: "0644"
  notify: restart kibana

- name: Copy kibana backup
  copy:
    src: kibana_backup.ndjson
    dest: /tmp/kibana_backup.ndjson
    owner: root
    group: root
    mode: "0644"

# Проверка что Kibana поднялась и имитация нажатия кнопки восстановления конфига
- name: Wait for Kibana to become ready (status green)
  uri:
    url: http://localhost:5601/api/status
    method: GET
    return_content: yes
  register: kibana_status
  until: "'available' in kibana_status.content or 'green' in kibana_status.content"
  retries: 24        # Количество попыток
  delay: 10          # Пауза между попытками 

- name: Import Kibana saved objects (.ndjson)
  shell: |
    curl -X POST \
      "http://localhost:5601/api/saved_objects/_import?overwrite=true" \
      -H "kbn-xsrf: true" \
      --form file=@/tmp/kibana_backup.ndjson
  register: kibana_import
  changed_when: true
