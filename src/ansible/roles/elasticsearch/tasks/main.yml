- name: Remove old conflicting apt sources list if exists
  file:
    path: /etc/apt/sources.list.d/elastic-7.x.list
    state: absent

- name: Add Elastic APT repository (Yandex Mirror)
  apt_repository:
    repo: "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/7/ stable main"
    filename: elastic-7.x
    state: present
    update_cache: yes

- name: Install elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: yes

- name: Copy elasticsearch conf
  copy:
    src: elasticsearch.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: root
    mode: "0644"
  notify: restart elasticsearch