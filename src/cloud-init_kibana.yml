runcmd:
# Install Zabbix Server and Agent2
  - wget https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
  - dpkg -i zabbix-release_latest_7.0+ubuntu24.04_all.deb
  - apt update
  - apt install -y zabbix-agent2
  - sed -i 's/^Server=.*/Server=zabbix/' /etc/zabbix/zabbix_agent2.conf
  - sed -i 's/^ServerActive=.*/ServerActive=zabbix/' /etc/zabbix/zabbix_agent2.conf
  - echo "HostMetadata=linux" >> /etc/zabbix/zabbix_agent2.conf
  - systemctl restart zabbix-agent2
  - systemctl enable zabbix-agent2
# Install Kibana
  - wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | apt-key add -
  - echo "deb [trusted=yes] https://mirror.yandex.ru/mirrors/elastic/7/ stable main" | tee /etc/apt/sources.list.d/elastic-7.x.list
  - apt update 
  - apt install -y kibana
  - "echo 'server.host: \"0.0.0.0\"' >> /etc/kibana/kibana.yml"
  - "echo 'elasticsearch.hosts: [\"http://elasticsearch:9200\"]' >> /etc/kibana/kibana.yml"
  - systemctl daemon-reload
  - systemctl enable kibana.service
  - systemctl start kibana.service

  