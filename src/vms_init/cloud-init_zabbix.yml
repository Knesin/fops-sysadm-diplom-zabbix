#cloud-config
users:
  - name: user
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPm+ZOX+KvQwbs9dn/i+RrXT2x/B4642BpU9pZ+w99fT maksim@DESKTOP-U3S6BIN
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICsrrQZE2cs8uCZ4oUZcoErmtoLjiyY3nU3Hk0QlArQK maksim@DESKTOP-R5DV9UM
package_update: true
packages:
  - postgresql
runcmd:
  - wget https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
  - dpkg -i zabbix-release_latest_7.0+ubuntu24.04_all.deb
  - apt update
  - apt install -y zabbix-server-pgsql zabbix-frontend-php php8.3-pgsql zabbix-apache-conf zabbix-sql-scripts zabbix-agent2
  - sudo -u postgres psql -c "CREATE USER zabbix WITH PASSWORD '123456789';"
  - sudo -u postgres psql -c "CREATE DATABASE zabbix OWNER zabbix;"
  - wget -O /tmp/zabbix.dump ${DUMP_URL}
  - sudo -u postgres pg_restore --clean --if-exists -d zabbix /tmp/zabbix.dump
  - echo "DBHost=localhost" >> /etc/zabbix/zabbix_server.conf
  - echo "DBPassword=123456789" >> /etc/zabbix/zabbix_server.conf
  - systemctl restart zabbix-server zabbix-agent2 apache2 postgresql
  - systemctl enable zabbix-server zabbix-agent2 apache2 postgresql
write_files:
  - path: /etc/zabbix/web/zabbix.conf.php
    permissions: '0644'
    content: |
      ${ZABBIX_CONFIG_CONTENT}
